title: "SafetyLens: the factory safety agent that proves its case and argues against itself"
pitch: "SafetyLens ingests near-miss reports and maintenance logs, detects normalised deviance, red-teams every alert, and lets Strands Decider decide — then drafts the work order."
features:
  - "ingest messy reports and extract structured safety events"
  - "detect normalised deviance: the same barrier failure tolerated again and again"
  - "red-team/judge loop: the agent argues it is noise, Strands Decider 2B decides"
  - "Ignored Warnings Ledger: every open risk, days open, and cost exposure on one screen"
  - "run on Amazon Bedrock AgentCore Runtime"
eager: true
intro: "SafetyLens runs on Amazon Bedrock. For this demo it is in eager mode — it acts immediately so the guardrail has something to check. Strands Decider judges every alert before it is raised."
intro_normal: "SafetyLens runs on Amazon Bedrock AgentCore Runtime. It ingests reports, detects patterns, and lets Strands Decider judge every alert before it is raised."
turns:
  - say: "Show me the Ignored Warnings Ledger."
    narrate: "The safety manager opens with the big picture: what risks are open, how long, and what they cost."
  - say: "Analyse PUMP-07. Is there a normalised deviance issue?"
    narrate: "PUMP-07 has had the same seal leak — with its containment tray bypassed — four times in three months."
  - say: "Raise a high-severity alert and draft an urgent work order for PUMP-07."
    narrate: "The agent proposes an alert. Strands Decider 2B reads the evidence and the red-team noise argument, then decides whether to raise or suppress."
  - say: "Now check BOILER-01 and take action."
    narrate: "A pressure relief valve stuck closed at 1.4 times design pressure — the decider rates this critical."
outro: "One forward pass per decision. The decider reads the evidence text and the noise counter-argument and returns calibrated probabilities the code branches on — no second LLM call needed. Built with the AWS User Group Madurai Strands Decider hackathon kit."
